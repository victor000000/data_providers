[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-providers"
version = "0.1.0"
description = "Shared market, reference, and trading data maintenance and delivery"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.0,<2", "requests>=2.31", "pytz>=2024.1"]

[project.optional-dependencies]
sources = ["ib_async", "yfinance", "curl-cffi", "futu-api", "alpaca-py", "akshare"]
analysis = ["pandas", "numpy", "openpyxl", "pytz", "tzdata"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
data-providers = "data_providers.cli:main"

[tool.setuptools.packages.find]
include = ["data_providers*"]

[tool.setuptools.package-data]
"data_providers.seed" = ["*.txt", "*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[[tool.uv.index]]
name = "pypi-public"
url = "https://pypi.org/simple"
default = true
